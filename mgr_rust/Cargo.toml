[package]
name = "mgr_rust"
version = "0.1.0"
edition = "2021"

# We are building a shared library that can be imported from Python.
[lib]
name = "mgr_rust"
crate-type = ["cdylib"]

[dependencies]
# Bindings between Rust and Python (built against the stable ABI)
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
# Safe wrappers around NumPy arrays – no extra feature flags needed
numpy = "0.20"
# N-dimensional array library used to reshape the linear output buffer.
ndarray = { version = "0.15", features = ["rayon"] }
# Parallel iteration to speed up the heavy innermost loop.
rayon = "1.8"
# Forward Rust logs into Python's logging module
pyo3-log = "0.8"
log = "0.4"
# Fast HashMap implementation
hashbrown = "0.14"
ordered-float = "4.2"
parking_lot = "0.12" 
nalgebra = { version = "0.32" }
# Random number generation
rand = "0.8"
rand_pcg = "0.3"
rstar = "0.11"

