project:
  type: website
  output-dir: _site
  resources:
  - "interactive/**"
  render:
  - "*.qmd"
  - "*.ipynb"
  - "*.md"
  - "!property_calculation.md"
jupyter: python3
execute:
  freeze: true
  cache: true
  warning: false
website:
  title: "mofography"
  description: "Pore graphs for periodic nanoporous materials: segmentation, textural properties, windows, percolation, and ML features from one calculation."
  site-url: https://mofography.github.io/mofography/
  repo-url: https://github.com/mofography/mofography
  repo-actions: [edit, issue]
  favicon: mofography_logo_outlined.png
  open-graph: true
  twitter-card: true
  page-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    logo:
      light: mofography_logo_white_background.png
      dark: mofography_logo_dark_background.png
    title: false
    pinned: true
    left:
    - text: Install
      file: install.qmd
    - text: Learn
      file: learn.qmd
    - text: Functions
      file: reference/index.qmd
    - text: Gallery
      file: gallery.qmd
    - text: Publications
      file: publications.qmd
    right:
    - icon: github
      href: https://github.com/mofography/mofography
      aria-label: GitHub
  page-footer:
    left: "BSD-3-Clause. Copyright 2022-2026 Arun Gopalan and contributors."
    right:
    - text: "Cite"
      href: https://github.com/mofography/mofography/blob/master/CITATION.cff
    - text: "Releases"
      href: https://github.com/mofography/mofography/releases
format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css: styles.css
    respect-user-color-scheme: true
    toc: true
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    code-fold: true
    code-summary: "Show code"
    include-after-body: code-fold.html
metadata-files:
- _sidebar.yml
