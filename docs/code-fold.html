<script>
// Reference index: stack description under each function name (see .mg-ref-index in styles.css).
if (/\/reference\/(index\.html)?$/.test(location.pathname)) document.body.classList.add("mg-ref-index");

// Search overlay: show tutorial/page hits first, reference (function-name) hits last under a label.
(function () {
  var isRef = function (li) {
    var a = li.querySelector("a.search-result-link");
    return !!a && /(^|\/)reference\//.test(a.getAttribute("href") || "");
  };
  var fix = function (list) {
    var ref = false, first = null;
    Array.prototype.forEach.call(list.children, function (li) {
      if (li.querySelector(".search-result-doc")) ref = isRef(li);  // a document starts a new block
      li.classList.toggle("mg-ref-item", ref);
      li.classList.remove("mg-ref-first");
      if (ref && li.querySelector(".search-result-doc") && !first) { first = li; }
    });
    if (first) first.classList.add("mg-ref-first");
    list.classList.add("mg-search-list");
  };
  new MutationObserver(function () {
    document.querySelectorAll(".aa-List").forEach(fix);
  }).observe(document.documentElement, { childList: true, subtree: true });
})();

// Reference index: filter rows by status tag.
document.addEventListener("DOMContentLoaded", function () {
  var bar = document.querySelector(".mg-tag-filter");
  if (!bar) return;
  var apply = function (tag) {
    bar.querySelectorAll(".mg-tag-btn").forEach(function (b) { b.classList.toggle("active", b.dataset.tag === tag); });
    var tags = document.querySelectorAll("#quarto-document-content td .mg-tag");
    tags.forEach(function (t) {
      var on = tag === "all" || t.className.indexOf("mg-tag-" + tag) > -1;
      t.closest("tr").style.display = on ? "" : "none";
    });
    // hide group headings and tables that end up empty
    document.querySelectorAll("#quarto-document-content table").forEach(function (tb) {
      var any = Array.prototype.some.call(tb.querySelectorAll("tr"), function (r) { return r.style.display !== "none" && r.querySelector("td"); });
      tb.style.display = any ? "" : "none";
      var el = tb.previousElementSibling;
      while (el && !/^H[23]$/.test(el.tagName)) { if (el.tagName === "P" || el.tagName === "DIV") el.style.display = any ? "" : "none"; el = el.previousElementSibling; }
      if (el && el.tagName === "H3") el.style.display = any ? "" : "none";
    });
  };
  bar.addEventListener("click", function (e) { if (e.target.dataset.tag) apply(e.target.dataset.tag); });
});

// Reference sidebar: one button to fold or unfold every module group.
document.addEventListener("DOMContentLoaded", function () {
  if (!/\/reference\//.test(location.pathname)) return;
  var menu = document.querySelector("#quarto-sidebar .sidebar-menu-container");
  if (!menu) return;
  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "mg-fold-all";
  var togglers = function (open) {
    return menu.querySelectorAll('a[data-bs-toggle="collapse"][aria-expanded="' + open + '"]');
  };
  var label = function () { btn.textContent = togglers("true").length ? "Fold all" : "Unfold all"; };
  btn.addEventListener("click", function () {
    var open = togglers("true");
    var targets = open.length ? open : togglers("false");
    targets.forEach(function (a) { a.click(); });
    setTimeout(label, 400);
  });
  menu.addEventListener("click", function () { setTimeout(label, 400); });
  label();
  menu.insertBefore(btn, menu.firstChild);
});
// Collapse long text outputs (> 25 lines) into a scrollable box with a toggle.
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".cell-output pre, .cell-output-stdout pre, .cell-output-stderr pre").forEach(function (pre) {
    if (pre.closest(".mg-out-fold") || pre.closest("details.code-fold")) return;
    if (pre.textContent.split("\n").length <= 25) return;
    var wrap = document.createElement("div");
    wrap.className = "mg-out-fold";
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    pre.classList.add("mg-collapsed");
    var n = pre.textContent.split("\n").length;
    var b = document.createElement("button");
    b.type = "button"; b.className = "mg-out-toggle";
    var label = function () { return pre.classList.contains("mg-collapsed") ? "Show full output (" + n + " lines)" : "Collapse output"; };
    b.textContent = label();
    b.addEventListener("click", function () { pre.classList.toggle("mg-collapsed"); b.textContent = label(); });
    wrap.appendChild(b);
  });
});
</script>
